name: Feature request
description: Suggest an improvement for Forkspaces
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do, and what gets in the way? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: markdown
    attributes:
      value: Do not include authentication tokens, cookies, account data or private conversations.
